<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Summarizer - Free & Open Source</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Book Summarizer</h1>
      <p>Get comprehensive summaries of any book - Free & Open Source</p>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('pdf')">Upload PDF</button>
      <button class="tab" onclick="switchTab('title')">Enter Book Title</button>
    </div>

    <div id="pdf-tab" class="tab-content active">
      <div class="upload-section">
        <h2>Upload a PDF Book</h2>
        <input type="file" id="pdfFile" accept=".pdf">
        <button onclick="summarizePDF()">Generate Summary</button>
      </div>
    </div>

    <div id="title-tab" class="tab-content">
      <div class="title-section">
        <h2>Enter Book Title</h2>
        <input type="text" id="bookTitle" placeholder="e.g., To Kill a Mockingbird by Harper Lee">
        <button onclick="summarizeTitle()">Generate Summary</button>
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Generating summary... This may take a minute.</p>
    </div>

    <div id="result" class="result hidden">
      <h2>Book Summary</h2>
      <div id="summary"></div>
      <button onclick="copyToClipboard()">Copy Summary</button>
      <button onclick="downloadSummary()">Download as Text</button>
    </div>

    <footer>
      <p>Made with ❤️ for book lovers | <a href="https://github.com" target="_blank">Open Source on GitHub</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
