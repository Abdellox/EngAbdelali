<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Lorem Ipsum Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Multilingual Text Generator</h1>
            <p>Generate placeholder text in any language</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="mode">Mode:</label>
                <select id="mode">
                    <option value="random">Random Text</option>
                    <option value="topic">Topic-Based</option>
                </select>
            </div>

            <div class="control-group" id="languageGroup">
                <label for="language">Language:</label>
                <select id="language">
                    <option value="latin">Latin (Lorem Ipsum)</option>
                    <option value="english">English</option>
                    <option value="spanish">Spanish</option>
                    <option value="french">French</option>
                    <option value="german">German</option>
                    <option value="italian">Italian</option>
                    <option value="portuguese">Portuguese</option>
                    <option value="russian">Russian</option>
                    <option value="chinese">Chinese</option>
                    <option value="japanese">Japanese</option>
                    <option value="korean">Korean</option>
                    <option value="arabic">Arabic</option>
                    <option value="hindi">Hindi</option>
                </select>
            </div>

            <div class="control-group" id="topicGroup" style="display: none;">
                <label for="topic">Topic:</label>
                <select id="topic">
                    <option value="football">⚽ Football/Soccer</option>
                    <option value="basketball">🏀 Basketball</option>
                    <option value="technology">💻 Technology</option>
                    <option value="cooking">🍳 Cooking & Food</option>
                    <option value="travel">✈️ Travel</option>
                    <option value="business">💼 Business</option>
                    <option value="fitness">💪 Fitness & Health</option>
                    <option value="fashion">👗 Fashion</option>
                    <option value="science">🔬 Science</option>
                    <option value="music">🎵 Music</option>
                </select>
            </div>

            <div class="control-group">
                <label for="textType">Type:</label>
                <select id="textType">
                    <option value="title">Title</option>
                    <option value="sentence">Sentence</option>
                    <option value="paragraph">Paragraph</option>
                    <option value="paragraphs">Multiple Paragraphs</option>
                </select>
            </div>

            <div class="control-group">
                <label for="count">Count:</label>
                <input type="number" id="count" min="1" max="50" value="3">
            </div>

            <button id="generateBtn" class="btn-primary">Generate Text</button>
        </div>

        <div class="output-section">
            <div class="output-header">
                <h2>Generated Text</h2>
                <button id="copyBtn" class="btn-secondary">📋 Copy</button>
            </div>
            <textarea id="output" readonly placeholder="Your generated text will appear here..."></textarea>
            <div id="copyNotification" class="notification">Copied to clipboard!</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
