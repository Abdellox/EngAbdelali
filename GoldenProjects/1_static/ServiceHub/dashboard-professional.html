<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - المحترف</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .dashboard {
            min-height: 100vh;
            background: var(--bg-light);
        }
        .dashboard-header {
            background: white;
            padding: 1.5rem 0;
            box-shadow: var(--shadow);
        }
        .dashboard-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .dashboard-content {
            padding: 2rem 0;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
        }
        .sidebar {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            height: fit-content;
            box-shadow: var(--shadow);
        }
        .sidebar-menu {
            list-style: none;
        }
        .sidebar-menu li {
            margin-bottom: 0.5rem;
        }
        .sidebar-menu a {
            display: block;
            padding: 0.8rem 1rem;
            color: var(--text-dark);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: var(--primary-color);
            color: white;
        }
        .main-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
        }
        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .order-card {
            background: var(--bg-light);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .order-status {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }
        .status-accepted {
            background: #d1fae5;
            color: #065f46;
        }
        .status-completed {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }
        .order-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <div class="container">
                <div class="dashboard-nav">
                    <div class="logo">
                        <h2>خدماتي - لوحة المحترف</h2>
                    </div>
                    <div class="user-info">
                        <span id="user-name">مرحباً</span>
                        <div class="user-avatar" id="user-avatar">م</div>
                        <button class="btn-secondary" id="logout-btn">تسجيل الخروج</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="dashboard-content">
            <div class="container">
                <div class="dashboard-grid">
                    <aside class="sidebar">
                        <ul class="sidebar-menu">
                            <li><a href="#" class="active" data-section="overview">نظرة عامة</a></li>
                            <li><a href="#" data-section="orders">الطلبات</a></li>
                            <li><a href="#" data-section="profile">الملف الشخصي</a></li>
                        </ul>
                    </aside>

                    <main class="main-content">
                        <!-- Overview Section -->
                        <div id="overview-section" class="content-section">
                            <h2>نظرة عامة</h2>
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <h3 id="total-orders">0</h3>
                                    <p>إجمالي الطلبات</p>
                                </div>
                                <div class="stat-card">
                                    <h3 id="pending-orders">0</h3>
                                    <p>طلبات جديدة</p>
                                </div>
                                <div class="stat-card">
                                    <h3 id="accepted-orders">0</h3>
                                    <p>طلبات مقبولة</p>
                                </div>
                                <div class="stat-card">
                                    <h3 id="completed-orders">0</h3>
                                    <p>طلبات مكتملة</p>
                                </div>
                            </div>
                            <h3>طلبات جديدة</h3>
                            <div id="new-orders"></div>
                        </div>

                        <!-- Orders Section -->
                        <div id="orders-section" class="content-section" style="display: none;">
                            <h2>جميع الطلبات</h2>
                            <div class="form-group">
                                <select id="filter-status" style="padding: 0.8rem; border-radius: 8px; border: 2px solid var(--border-color); font-family: 'Cairo', sans-serif;">
                                    <option value="">جميع الحالات</option>
                                    <option value="pending">قيد الانتظار</option>
                                    <option value="accepted">مقبول</option>
                                    <option value="completed">مكتمل</option>
                                    <option value="cancelled">ملغي</option>
                                </select>
                            </div>
                            <div id="orders-list"></div>
                        </div>

                        <!-- Profile Section -->
                        <div id="profile-section" class="content-section" style="display: none;">
                            <h2>الملف الشخصي</h2>
                            <form id="profile-form">
                                <div class="form-group">
                                    <label>الاسم الكامل</label>
                                    <input type="text" id="profile-name" required>
                                </div>
                                <div class="form-group">
                                    <label>البريد الإلكتروني</label>
                                    <input type="email" id="profile-email" disabled>
                                </div>
                                <div class="form-group">
                                    <label>رقم الهاتف</label>
                                    <input type="tel" id="profile-phone" required>
                                </div>
                                <div class="form-group">
                                    <label>المهنة</label>
                                    <input type="text" id="profile-profession" disabled>
                                </div>
                                <div class="form-group">
                                    <label>التقييم</label>
                                    <input type="text" id="profile-rating" disabled>
                                </div>
                                <button type="submit" class="btn-primary">حفظ التغييرات</button>
                            </form>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </div>

    <script src="dashboard-professional.js"></script>
</body>
</html>
