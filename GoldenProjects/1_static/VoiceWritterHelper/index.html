<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to Text - Free Writing Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎤 Voice to Text</h1>
            <p class="subtitle">Free speech-to-text tool for writers</p>
        </header>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">
                <span class="icon">🎙️</span> Start Recording
            </button>
            <button id="stopBtn" class="btn btn-stop" disabled>
                <span class="icon">⏹️</span> Stop Recording
            </button>
            <select id="languageSelect" class="language-select">
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
                <option value="es-ES">Spanish</option>
                <option value="fr-FR">French</option>
                <option value="de-DE">German</option>
                <option value="it-IT">Italian</option>
                <option value="pt-BR">Portuguese (Brazil)</option>
                <option value="ar-SA">Arabic</option>
                <option value="zh-CN">Chinese (Simplified)</option>
                <option value="ja-JP">Japanese</option>
                <option value="ko-KR">Korean</option>
                <option value="hi-IN">Hindi</option>
            </select>
        </div>

        <div class="status" id="status">Ready to record</div>

        <div class="visualizer-container" id="visualizerContainer">
            <div class="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <textarea id="textArea" placeholder="Your transcribed text will appear here... Click 'Start Recording' and begin speaking."></textarea>

        <div class="actions">
            <button id="copyBtn" class="btn btn-secondary">📋 Copy Text</button>
            <button id="downloadBtn" class="btn btn-secondary">💾 Download</button>
            <button id="clearBtn" class="btn btn-danger">🗑️ Clear</button>
        </div>

        <footer>
            <p>Open source and free for everyone ❤️</p>
            <p class="note">Works in Chrome, Edge, Brave, and Safari. Requires microphone permission.</p>
            <p class="note"><a href="debug.html" style="color: #667eea;">Having issues? Click here for debug tool</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
