<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flipper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎨 Color Flipper</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="flipper-box">
            <h1 class="color-name" id="colorName">#667eea</h1>
            
            <button onclick="flipColor()" class="btn-flip">Flip Color</button>
            
            <div class="mode-toggle">
                <button onclick="setMode('hex')" class="mode-btn active" id="hexBtn">HEX</button>
                <button onclick="setMode('rgb')" class="mode-btn" id="rgbBtn">RGB</button>
                <button onclick="setMode('hsl')" class="mode-btn" id="hslBtn">HSL</button>
            </div>
            
            <button onclick="copyColor()" class="btn-copy">Copy Color</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
