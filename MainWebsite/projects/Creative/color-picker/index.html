<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎨 Color Picker</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="picker-box">
            <div class="color-display" id="colorDisplay"></div>
            
            <input type="color" id="colorInput" value="#667eea">
            
            <div class="color-info">
                <div class="info-item">
                    <label>HEX</label>
                    <input type="text" id="hexValue" readonly>
                </div>
                <div class="info-item">
                    <label>RGB</label>
                    <input type="text" id="rgbValue" readonly>
                </div>
                <div class="info-item">
                    <label>HSL</label>
                    <input type="text" id="hslValue" readonly>
                </div>
            </div>
            
            <button onclick="copyHex()" class="btn">Copy HEX</button>
            
            <div class="palette" id="palette"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
