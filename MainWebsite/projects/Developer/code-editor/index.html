<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">💻 Code Editor</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="editor-box">
            <div class="tabs">
                <button onclick="switchTab('html')" class="tab active" id="htmlTab">HTML</button>
                <button onclick="switchTab('css')" class="tab" id="cssTab">CSS</button>
                <button onclick="switchTab('js')" class="tab" id="jsTab">JavaScript</button>
            </div>
            
            <textarea id="htmlCode" class="code-area" placeholder="HTML code..."></textarea>
            <textarea id="cssCode" class="code-area" style="display:none" placeholder="CSS code..."></textarea>
            <textarea id="jsCode" class="code-area" style="display:none" placeholder="JavaScript code..."></textarea>
            
            <button onclick="runCode()" class="btn-run">▶ Run Code</button>
            
            <iframe id="output"></iframe>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
