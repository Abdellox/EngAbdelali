<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🔍 GitHub Finder</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    <div class="finder-container">
        <div class="search-box">
            <input type="text" id="username" placeholder="Enter GitHub username...">
            <button onclick="searchUser()">Search</button>
        </div>
    <div class="profile-card" id="profile" style="display: none;">
            <div class="profile-header">
                <img src="" alt="Avatar" id="avatar">
                <div class="profile-info">
                    <h2 id="name">Name</h2>
                    <p id="bio">Bio</p>
                    <a href="#" id="profileLink" target="_blank">View Profile</a>
                </div>
    </div>
            <div class="profile-stats">
                <div class="stat">
                    <span class="stat-value" id="repos">0</span>
                    <span class="stat-label">Repositories</span>
                </div>
    <div class="stat">
                    <span class="stat-value" id="followers">0</span>
                    <span class="stat-label">Followers</span>
                </div>
    <div class="stat">
                    <span class="stat-value" id="following">0</span>
                    <span class="stat-label">Following</span>
                </div>
    </div>
        </div>
    <div class="error" id="error" style="display: none;">
            <p>User not found! Try another username.</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
