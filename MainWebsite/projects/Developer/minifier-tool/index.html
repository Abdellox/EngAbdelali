<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minifier Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📦 Minifier Tool</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <h1>Code Minifier</h1>
        <div class="controls">
            <select id="type">
                <option value="js">JavaScript</option>
                <option value="css">CSS</option>
                <option value="html">HTML</option>
            </select>
            <button onclick="minifyCode()">Minify</button>
        </div>
        <textarea id="input" placeholder="Paste your code here..."></textarea>
        <div id="stats" class="stats"></div>
        <textarea id="output" placeholder="Minified code will appear here..." readonly></textarea>
    </div>
    <script src="app.js"></script>
</body>
</html>
