<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB/Hex Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎨 RGB/Hex Converter</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>

    <div class="container">
        <div class="converter-box">
            <div class="color-preview" id="colorPreview"></div>

            <div class="converter-section">
                <h3>RGB to Hex</h3>
                <div class="rgb-inputs">
                    <div class="input-group">
                        <label>R</label>
                        <input type="number" id="r" min="0" max="255" value="102">
                    </div>
                    <div class="input-group">
                        <label>G</label>
                        <input type="number" id="g" min="0" max="255" value="126">
                    </div>
                    <div class="input-group">
                        <label>B</label>
                        <input type="number" id="b" min="0" max="255" value="234">
                    </div>
                </div>
                <div class="result-box">
                    <input type="text" id="hexResult" readonly>
                    <button onclick="copyHex()">Copy</button>
                </div>
            </div>

            <div class="divider">⇅</div>

            <div class="converter-section">
                <h3>Hex to RGB</h3>
                <div class="hex-input">
                    <input type="text" id="hexInput" placeholder="#667eea" maxlength="7">
                </div>
                <div class="result-box">
                    <input type="text" id="rgbResult" readonly>
                    <button onclick="copyRgb()">Copy</button>
                </div>
            </div>

            <div class="color-picker-section">
                <h3>Color Picker</h3>
                <input type="color" id="colorPicker" value="#667eea">
            </div>

            <div class="presets">
                <h3>Color Presets</h3>
                <div class="preset-grid">
                    <div class="preset-color" style="background: #667eea" onclick="applyPreset('#667eea')"></div>
                    <div class="preset-color" style="background: #764ba2" onclick="applyPreset('#764ba2')"></div>
                    <div class="preset-color" style="background: #ff6b6b" onclick="applyPreset('#ff6b6b')"></div>
                    <div class="preset-color" style="background: #2ed573" onclick="applyPreset('#2ed573')"></div>
                    <div class="preset-color" style="background: #feca57" onclick="applyPreset('#feca57')"></div>
                    <div class="preset-color" style="background: #48dbfb" onclick="applyPreset('#48dbfb')"></div>
                    <div class="preset-color" style="background: #ff9ff3" onclick="applyPreset('#ff9ff3')"></div>
                    <div class="preset-color" style="background: #54a0ff" onclick="applyPreset('#54a0ff')"></div>
                </div>
            </div>

            <div class="info-section">
                <h3>Color Information</h3>
                <div class="info-grid">
                    <div class="info-item">
                        <strong>HSL:</strong>
                        <span id="hslValue">-</span>
                    </div>
                    <div class="info-item">
                        <strong>CMYK:</strong>
                        <span id="cmykValue">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
