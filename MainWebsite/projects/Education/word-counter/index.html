<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📝 Word Counter</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    <div class="counter-container">
        <div class="counter-box">
            <h2>Text Analysis Tool</h2>
            <textarea id="text" placeholder="Start typing or paste your text here..."></textarea>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="characters">0</div>
    <div class="stat-label">Characters</div>
    </div>
                <div class="stat-card">
                    <div class="stat-value" id="words">0</div>
    <div class="stat-label">Words</div>
    </div>
                <div class="stat-card">
                    <div class="stat-value" id="sentences">0</div>
    <div class="stat-label">Sentences</div>
    </div>
                <div class="stat-card">
                    <div class="stat-value" id="paragraphs">0</div>
    <div class="stat-label">Paragraphs</div>
    </div>
                <div class="stat-card">
                    <div class="stat-value" id="readTime">0</div>
    <div class="stat-label">Read Time (min)</div>
    </div>
            </div>
    </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
