<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🤖 Chatbot</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="chatbot-box">
            <div class="bot-header">
                <div class="bot-avatar">🤖</div>
                <div>
                    <div class="bot-name">AI Assistant</div>
                    <div class="bot-status">Always here to help</div>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-content">Hi! I'm your AI assistant. How can I help you today?</div>
                </div>
            </div>
            <div class="quick-replies">
                <button onclick="sendQuick('Tell me a joke')" class="quick-btn">😄 Tell me a joke</button>
                <button onclick="sendQuick('What can you do?')" class="quick-btn">❓ What can you do?</button>
                <button onclick="sendQuick('Help me')" class="quick-btn">🆘 Help me</button>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Ask me anything..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()" class="btn-send">➤</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
