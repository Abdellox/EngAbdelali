<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🃏 Blackjack</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="game-box">
            <div class="dealer-section">
                <h3>Dealer <span id="dealerScore">0</span></h3>
                <div class="cards" id="dealerCards"></div>
            </div>
            <div class="player-section">
                <h3>Player <span id="playerScore">0</span></h3>
                <div class="cards" id="playerCards"></div>
            </div>
            <div class="controls">
                <button onclick="hit()" id="hitBtn" class="btn-hit">Hit</button>
                <button onclick="stand()" id="standBtn" class="btn-stand">Stand</button>
                <button onclick="newGame()" class="btn-new">New Game</button>
            </div>
            <div class="message" id="message"></div>
            <div class="stats">
                <div>Wins: <span id="wins">0</span></div>
                <div>Losses: <span id="losses">0</span></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
