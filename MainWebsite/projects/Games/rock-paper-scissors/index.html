<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">✊ RPS</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="game-box">
            <h2>Rock Paper Scissors</h2>
            
            <div class="choices">
                <button onclick="play('rock')" class="choice">✊<br>Rock</button>
                <button onclick="play('paper')" class="choice">✋<br>Paper</button>
                <button onclick="play('scissors')" class="choice">✌️<br>Scissors</button>
            </div>
            
            <div class="result" id="result">Choose your move!</div>
            
            <div class="score">
                You: <span id="you">0</span> | Computer: <span id="comp">0</span>
            </div>
            
            <button onclick="reset()" class="btn-reset">Reset Game</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
