<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎡 Roulette</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <h1>Roulette Game</h1>
        <div class="credits">Credits: <span id="credits">100</span></div>
        <div class="bet-input">
            <label>Bet Amount: <input type="number" id="betAmount" value="10" min="1"></label>
        </div>
        <div class="bets">
            <button onclick="placeBet('red')" class="bet-btn red">Red</button>
            <button onclick="placeBet('black')" class="bet-btn black">Black</button>
            <button onclick="placeBet('even')" class="bet-btn">Even</button>
            <button onclick="placeBet('odd')" class="bet-btn">Odd</button>
        </div>
        <div id="result" class="result"></div>
        <div id="message" class="message"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
