<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Track Your Workouts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💪 Fitness Tracker</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🏋️</div>
                <div class="stat-value" id="totalWorkouts">0</div>
                <div class="stat-label">Total Workouts</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="totalSets">0</div>
                <div class="stat-label">Total Sets</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💯</div>
                <div class="stat-value" id="totalReps">0</div>
                <div class="stat-label">Total Reps</div>
            </div>
        </div>

        <div class="add-workout">
            <h2>Add New Workout</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="exerciseType">Exercise Type</label>
                    <select id="exerciseType">
                        <option value="">Select Exercise</option>
                        <option value="Push-ups">Push-ups</option>
                        <option value="Pull-ups">Pull-ups</option>
                        <option value="Squats">Squats</option>
                        <option value="Bench Press">Bench Press</option>
                        <option value="Deadlift">Deadlift</option>
                        <option value="Running">Running</option>
                        <option value="Cycling">Cycling</option>
                        <option value="Plank">Plank</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="customExercise">Custom Exercise</label>
                    <input type="text" id="customExercise" placeholder="Enter custom exercise">
                </div>
                <div class="form-group">
                    <label for="sets">Sets</label>
                    <input type="number" id="sets" placeholder="Number of sets" min="1">
                </div>
                <div class="form-group">
                    <label for="reps">Reps/Duration</label>
                    <input type="number" id="reps" placeholder="Reps or minutes" min="1">
                </div>
            </div>
            <button id="addWorkout">Add Workout</button>
        </div>

        <div class="workouts-section">
            <h2>Workout History</h2>
            <div class="workouts-list" id="workoutsList"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
