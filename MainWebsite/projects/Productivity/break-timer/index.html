<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">⏱️ Break Timer</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="timer-box">
            <div class="mode" id="mode">Work Time</div>
            <div class="time" id="time">25:00</div>
            <div class="controls">
                <button onclick="start()" id="startBtn" class="btn btn-start">Start</button>
                <button onclick="reset()" class="btn btn-reset">Reset</button>
            </div>
            <div class="settings">
                <h3>Settings</h3>
                <div class="setting-group">
                    <label>Work (minutes):</label>
                    <input type="number" id="workInput" value="25" min="1">
                    <button onclick="setWork()">Set</button>
                </div>
                <div class="setting-group">
                    <label>Break (minutes):</label>
                    <input type="number" id="breakInput" value="5" min="1">
                    <button onclick="setBreak()">Set</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
