<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distraction Blocker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🚫 Distraction Blocker</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <h1>Block Distracting Sites</h1>
        <div class="add-site">
            <input type="text" id="siteInput" placeholder="Enter website to block (e.g., facebook.com)" onkeypress="if(event.key==='Enter') addSite()">
            <button onclick="addSite()">Add</button>
        </div>
        <div id="blockedList" class="blocked-list"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
