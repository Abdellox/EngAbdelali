<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎯 Focus Mode</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <h1>Focus Mode Timer</h1>
        <div class="display" id="display">25:00</div>
        <div class="controls">
            <label>Minutes: <input type="number" id="minutes" value="25" min="1" max="120"></label>
        </div>
        <div class="buttons">
            <button onclick="startFocus()" id="startBtn">Start Focus</button>
            <button onclick="stopFocus()" id="stopBtn" disabled>Stop</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
