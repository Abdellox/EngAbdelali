<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📋 Kanban Board</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="kanban-container">
        <div class="column">
            <h3>To Do</h3>
            <div class="tasks" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <button onclick="addTask('todo')" class="btn-add">+ Add Task</button>
        </div>
        
        <div class="column">
            <h3>In Progress</h3>
            <div class="tasks" id="progress" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <button onclick="addTask('progress')" class="btn-add">+ Add Task</button>
        </div>
        
        <div class="column">
            <h3>Done</h3>
            <div class="tasks" id="done" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <button onclick="addTask('done')" class="btn-add">+ Add Task</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
