<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🍅 Pomodoro Timer</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>

    <div class="container">
        <div class="timer-box">
            <div class="mode-indicator" id="modeIndicator">Work Time</div>
            
            <div class="timer-display" id="timerDisplay">25:00</div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="controls">
                <button class="btn-control btn-start" id="startBtn">Start</button>
                <button class="btn-control btn-pause" id="pauseBtn" style="display: none;">Pause</button>
                <button class="btn-control btn-reset" id="resetBtn">Reset</button>
            </div>

            <div class="settings">
                <h3>Settings</h3>
                <div class="setting-item">
                    <label>Work Duration (minutes)</label>
                    <input type="number" id="workDuration" min="1" max="60" value="25">
                </div>
                <div class="setting-item">
                    <label>Break Duration (minutes)</label>
                    <input type="number" id="breakDuration" min="1" max="30" value="5">
                </div>
                <div class="setting-item">
                    <label>Long Break (minutes)</label>
                    <input type="number" id="longBreakDuration" min="1" max="60" value="15">
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Sessions Completed</span>
                    <span class="stat-value" id="sessionsCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Focus Time</span>
                    <span class="stat-value" id="totalTime">0 min</span>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
