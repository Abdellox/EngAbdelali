<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📝 Advanced Todo</h1>
            <a href="../../../index.html" class="back-link">Back to Portfolio</a>
        </div><div class="container">
        <div class="todo-container">
            <div class="input-section">
                <input type="text" id="todoInput" placeholder="Add a new todo..." />
                <button id="addBtn">Add</button>
            </div><div class="controls">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div><select id="sortSelect">
                    <option value="date">Sort by Date</option>
                    <option value="priority">Sort by Priority</option>
                </select>
            </div><div id="stats" class="stats"></div><div id="todoList" class="todo-list"></div><button id="clearBtn" class="clear-btn">Clear Completed</button>
        </div></div>

    <script src="app.js"></script>
</body>
</html>
