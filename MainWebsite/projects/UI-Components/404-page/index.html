<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <div class="error-content">
            <div class="astronaut">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>
            
            <h1 class="error-code">
                <span class="digit">4</span>
                <span class="digit">0</span>
                <span class="digit">4</span>
            </h1>
            
            <h2 class="error-message">Houston, We Have a Problem!</h2>
            <p class="error-description">The page you're looking for has drifted into space...</p>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search for a page..." />
                <button onclick="searchSite()">🔍 Search</button>
            </div>
            
            <div class="button-group">
                <a href="../../../index.html" class="btn btn-primary">
                    <span>🏠</span> Go Home
                </a>
                <button onclick="goBack()" class="btn btn-secondary">
                    <span>←</span> Go Back
                </button>
            </div>
            
            <div class="suggestions">
                <p>Maybe try one of these:</p>
                <ul>
                    <li><a href="../../../index.html">Home Page</a></li>
                    <li><a href="../../index.html#projects">Projects</a></li>
                    <li><a href="../../index.html#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
