<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion Component - FAQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📋 Accordion</h1>
            <a href="../../../index.html" class="back-link">← Back to Portfolio</a>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Frequently Asked Questions</h1>
            <p>Click on any question to reveal the answer</p>
        </div>

        <div class="controls">
            <button onclick="expandAll()" class="control-btn">Expand All</button>
            <button onclick="collapseAll()" class="control-btn">Collapse All</button>
        </div>

        <div class="accordion" id="accordion">
            <!-- Accordion items will be generated by JavaScript -->
        </div>

        <div class="stats">
            <p>Total Questions: <span id="totalQuestions">0</span></p>
            <p>Expanded: <span id="expandedCount">0</span></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
