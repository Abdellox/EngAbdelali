<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📋 Context Menu</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="demo-box">
            <h2>Right-click anywhere!</h2>
            <p>Try right-clicking in this area to see the custom context menu</p>
        </div>
    </div>
    
    <div class="context-menu" id="contextMenu">
        <div class="menu-item" onclick="action('Copy')">📋 Copy</div>
        <div class="menu-item" onclick="action('Cut')">✂️ Cut</div>
        <div class="menu-item" onclick="action('Paste')">📄 Paste</div>
        <div class="menu-divider"></div>
        <div class="menu-item" onclick="action('Delete')">🗑️ Delete</div>
        <div class="menu-item" onclick="action('Rename')">✏️ Rename</div>
        <div class="menu-divider"></div>
        <div class="menu-item" onclick="action('Properties')">⚙️ Properties</div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
