<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag and Drop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">🎯 Drag and Drop</h1>
      <a href="../../../index.html" class="back-link">← Back</a>
    </div>
  </nav>
  <div class="container">
    <h2>Drag and Drop</h2>
    <p class="instruction">Drag items between the boxes</p>
    <div class="drop-zones">
      <div class="drop-zone" id="zone1">
        <h3>To Do</h3>
        <div class="draggable" draggable="true">Task 1</div>
        <div class="draggable" draggable="true">Task 2</div>
        <div class="draggable" draggable="true">Task 3</div>
      </div>
      <div class="drop-zone" id="zone2">
        <h3>In Progress</h3>
      </div>
      <div class="drop-zone" id="zone3">
        <h3>Done</h3>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
