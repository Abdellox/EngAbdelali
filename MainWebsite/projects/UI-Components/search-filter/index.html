<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Filter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">🔍 Search Filter</h1>
      <a href="../../../index.html" class="back-link">← Back</a>
    </div>
  </nav>
  <div class="container">
    <h2>Search Filter</h2>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search items...">
      <span class="search-icon">🔍</span>
    </div>
    <div class="items-list" id="itemsList">
      <div class="item">Apple</div>
      <div class="item">Banana</div>
      <div class="item">Cherry</div>
      <div class="item">Date</div>
      <div class="item">Elderberry</div>
      <div class="item">Fig</div>
      <div class="item">Grape</div>
      <div class="item">Honeydew</div>
      <div class="item">Kiwi</div>
      <div class="item">Lemon</div>
      <div class="item">Mango</div>
      <div class="item">Orange</div>
    </div>
    <p class="result-count" id="resultCount">Showing 12 items</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
