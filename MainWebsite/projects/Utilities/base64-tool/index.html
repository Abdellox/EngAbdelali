<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🔐 Base64 Tool</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="tool-box">
            <h2>Base64 Encoder/Decoder</h2>
            <div class="section">
                <h3>Input</h3>
                <textarea id="input" placeholder="Enter text or Base64..."></textarea>
            </div>
            <div class="controls">
                <button onclick="encode()" class="btn-encode">Encode</button>
                <button onclick="decode()" class="btn-decode">Decode</button>
                <button onclick="swap()" class="btn-swap">Swap</button>
                <button onclick="copy()" class="btn-copy">Copy</button>
                <button onclick="clear()" class="btn-clear">Clear</button>
            </div>
            <div class="section">
                <h3>Output</h3>
                <textarea id="output" readonly></textarea>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
