<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">💻 Binary Converter</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="converter-box">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('text')">Text ↔ Binary</button>
                <button class="tab-btn" onclick="switchTab('number')">Number ↔ Binary</button>
            </div>
            <div class="tab-content active" id="text-tab">
                <div class="input-group">
                    <label>Text Input</label>
                    <textarea id="textInput" placeholder="Enter text..."></textarea>
                </div>
                <div class="button-group">
                    <button onclick="textToBinary()" class="btn-primary">Text → Binary</button>
                    <button onclick="binaryToText()" class="btn-secondary">Binary → Text</button>
                </div>
                <div class="input-group">
                    <label>Binary Output</label>
                    <textarea id="binaryOutput" readonly></textarea>
                </div>
            </div>
            <div class="tab-content" id="number-tab">
                <div class="input-group">
                    <label>Decimal Number</label>
                    <input type="number" id="decimalInput" placeholder="Enter number...">
                </div>
                <div class="button-group">
                    <button onclick="decimalToBinary()" class="btn-primary">Decimal → Binary</button>
                    <button onclick="binaryToDecimal()" class="btn-secondary">Binary → Decimal</button>
                </div>
                <div class="result-display" id="numberResult">Result will appear here</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
