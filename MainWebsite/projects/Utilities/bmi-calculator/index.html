<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">⚖️ BMI Calculator</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="calculator-box">
            <h2>Body Mass Index Calculator</h2>
            <div class="unit-toggle">
                <button onclick="setUnit('metric')" class="unit-btn active" id="metricBtn">Metric</button>
                <button onclick="setUnit('imperial')" class="unit-btn" id="imperialBtn">Imperial</button>
            </div>
            <div class="input-section" id="metricInputs">
                <div class="input-group">
                    <label>Height (cm)</label>
                    <input type="number" id="heightCm" placeholder="170">
                </div>
                <div class="input-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weightKg" placeholder="70">
                </div>
            </div>
            <div class="input-section" id="imperialInputs" style="display:none">
                <div class="input-group">
                    <label>Height (inches)</label>
                    <input type="number" id="heightIn" placeholder="67">
                </div>
                <div class="input-group">
                    <label>Weight (lbs)</label>
                    <input type="number" id="weightLbs" placeholder="154">
                </div>
            </div>
            <button onclick="calculate()" class="btn-calculate">Calculate BMI</button>
            <div class="result" id="result" style="display:none">
                <div class="bmi-value" id="bmiValue">0</div>
                <div class="bmi-category" id="bmiCategory">-</div>
                <div class="bmi-bar">
                    <div class="bmi-indicator" id="bmiIndicator"></div>
                </div>
                <div class="categories">
                    <div class="cat underweight">Underweight &lt;18.5</div>
                    <div class="cat normal">Normal 18.5-24.9</div>
                    <div class="cat overweight">Overweight 25-29.9</div>
                    <div class="cat obese">Obese ≥30</div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
