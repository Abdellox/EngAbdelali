<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🔢 Counter</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="counter-box">
            <div class="count" id="count">0</div>
            
            <div class="buttons">
                <button onclick="decrease()" class="btn btn-decrease">−</button>
                <button onclick="reset()" class="btn btn-reset">Reset</button>
                <button onclick="increase()" class="btn btn-increase">+</button>
            </div>
            
            <div class="controls">
                <input type="number" id="stepInput" value="1" min="1">
                <button onclick="setStep()" class="btn-step">Set Step</button>
            </div>
            
            <p class="hint">Use ↑ ↓ arrow keys or R to reset</p>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
