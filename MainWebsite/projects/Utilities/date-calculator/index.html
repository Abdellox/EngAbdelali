<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📅 Date Calculator</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="calculator-box">
            <div class="tabs">
                <button onclick="switchTab('diff')" class="tab active" id="diffTab">Date Difference</button>
                <button onclick="switchTab('add')" class="tab" id="addTab">Add Days</button>
            </div>
            
            <div class="tab-content active" id="diffContent">
                <h3>Calculate Difference</h3>
                <div class="input-group">
                    <label>First Date</label>
                    <input type="date" id="date1">
                </div>
                <div class="input-group">
                    <label>Second Date</label>
                    <input type="date" id="date2">
                </div>
            </div>
            
            <div class="tab-content" id="addContent" style="display:none">
                <h3>Add Days to Date</h3>
                <div class="input-group">
                    <label>Start Date</label>
                    <input type="date" id="startDate">
                </div>
                <div class="input-group">
                    <label>Days to Add</label>
                    <input type="number" id="daysToAdd" placeholder="30">
                </div>
            </div>
            
            <button onclick="calculate()" class="btn-calculate">Calculate</button>
            
            <div id="resultBox" class="result-box" style="display:none">
                <div id="result"></div>
            </div>
        </div>
    </div>
    
    <input type="hidden" id="calcType" value="diff">
    <script src="app.js"></script>
</body>
</html>
