<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Splitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">✂️ File Splitter</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <h1>File Splitter</h1>
        <div class="upload">
            <input type="file" id="fileInput">
            <div class="file-info">
                <p>File: <span id="fileName">No file selected</span></p>
                <p>Size: <span id="fileSize">0 MB</span></p>
            </div>
        </div>
        <div class="controls">
            <label>Chunk Size (MB): <input type="number" id="chunkSize" value="10" min="1"></label>
            <button onclick="splitFile()">Split File</button>
        </div>
        <div id="result" class="result"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
