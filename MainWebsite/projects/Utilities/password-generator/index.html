<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🔐 Password</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="gen-box">
            <h2>Password Generator</h2>
            <div class="password" id="password">Click Generate</div>
            <div class="options">
                <label><input type="checkbox" id="upper" checked> Uppercase</label>
                <label><input type="checkbox" id="lower" checked> Lowercase</label>
                <label><input type="checkbox" id="numbers" checked> Numbers</label>
                <label><input type="checkbox" id="symbols"> Symbols</label>
                <label>Length: <input type="number" id="length" value="16" min="4" max="32"></label>
            </div>
            <button onclick="generate()" class="btn">Generate</button>
            <button onclick="copyPassword()" class="btn-copy">Copy</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
