<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📑 PDF Merger</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="merger-box">
            <h2>PDF Merger</h2>
            <p>Merge multiple PDF files into one (Demo)</p>
            
            <div class="upload-area">
                <div class="upload-icon">📁</div>
                <p>Click to upload PDF files</p>
                <input type="file" id="pdfInput" accept=".pdf" multiple hidden>
                <button onclick="document.getElementById('pdfInput').click()" class="btn-upload">Select PDFs</button>
            </div>
            
            <div id="fileList" class="file-list"></div>
            
            <button onclick="mergePDFs()" class="btn-merge">Merge PDFs</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
