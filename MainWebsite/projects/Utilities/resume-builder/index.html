<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📄 Resume Builder</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="resume-builder">
            <div class="form-section">
                <h2>Build Your Resume</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="phone" placeholder="+1 234 567 8900">
                </div>
                <div class="form-group">
                    <label>Professional Summary</label>
                    <textarea id="summary" rows="4" placeholder="Brief professional summary..."></textarea>
                </div>
                <div class="form-group">
                    <label>Skills (comma separated)</label>
                    <input type="text" id="skills" placeholder="JavaScript, React, Node.js">
                </div>
                <div class="form-group">
                    <label>Experience</label>
                    <textarea id="experience" rows="6" placeholder="Job Title - Company (Year-Year)&#10;• Achievement 1&#10;• Achievement 2"></textarea>
                </div>
                <div class="form-group">
                    <label>Education</label>
                    <textarea id="education" rows="4" placeholder="Degree - University (Year)"></textarea>
                </div>
                <div class="button-group">
                    <button onclick="generateResume()" class="btn-generate">Generate Resume</button>
                    <button onclick="downloadPDF()" class="btn-download">Download PDF</button>
                </div>
            </div>
            <div class="preview-section">
                <h2>Preview</h2>
                <div id="resumePreview" class="resume-preview">
                    <p class="placeholder">Fill the form to see preview</p>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
