<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">⏱️ Stopwatch</h1>
            <a href="../../../index.html" class="back-link">Back to Portfolio</a>
        </div><div class="container">
        <div class="stopwatch-container">
            <div class="display" id="display">00:00:00.000</div><div class="controls">
                <button id="startBtn" class="btn btn-start">Start</button>
                <button id="pauseBtn" class="btn btn-pause" disabled>Pause</button>
                <button id="resetBtn" class="btn btn-reset">Reset</button>
                <button id="lapBtn" class="btn btn-lap" disabled>Lap</button>
            </div><div class="laps" id="laps"></div></div>
    </div><script src="app.js"></script>
</body>
</html>
