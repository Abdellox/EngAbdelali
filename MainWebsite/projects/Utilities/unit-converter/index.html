<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🔄 Unit Converter</h1>
            <a href="../../../index.html" class="back-link">Back to Portfolio</a>
        </div><div class="container">
        <div class="converter">
            <select id="category" onchange="updateUnits()">
                <option value="length">Length</option>
                <option value="weight">Weight</option>
                <option value="temperature">Temperature</option>
            </select>
            <div class="conversion">
                <div class="input-group">
                    <input type="number" id="input" oninput="convert()" placeholder="0">
                    <select id="fromUnit"></select>
                </div><div class="equals">=</div><div class="input-group">
                    <input type="number" id="output" readonly placeholder="0">
                    <select id="toUnit" onchange="convert()"></select>
                </div></div>
        </div></div>
    <script src="app.js"></script>
</body>
</html>
