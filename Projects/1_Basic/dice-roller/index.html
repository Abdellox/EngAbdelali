<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Dice Roller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎲 Dice Roller</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="dice-box">
            <h2>🎲 Dice Roller</h2>
            
            <div class="dice-container" id="diceContainer">
                <div class="dice" id="dice">
                    <div class="dice-dot"></div>
                    <div class="dice-dot"></div>
                    <div class="dice-dot"></div>
                    <div class="dice-dot"></div>
                    <div class="dice-dot active"></div>
                    <div class="dice-dot"></div>
                    <div class="dice-dot"></div>
                    <div class="dice-dot"></div>
                    <div class="dice-dot"></div>
                </div>
                <div class="dice-emoji" id="diceEmoji">⚀</div>
            </div>
            
            <div class="result" id="result">Click Roll Dice to start!</div>
            
            <button onclick="rollDice()" class="btn-roll">Roll Dice</button>
            
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="totalRolls">0</div>
                        <div class="stat-label">Total Rolls</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="average">0</div>
                        <div class="stat-label">Average</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="highest">-</div>
                        <div class="stat-label">Highest</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="lowest">-</div>
                        <div class="stat-label">Lowest</div>
                    </div>
                </div>
                
                <div class="frequency-section">
                    <h3>Roll Frequency</h3>
                    <div class="frequency-chart" id="frequencyChart"></div>
                </div>
            </div>
            
            <div class="history-section">
                <h3>Recent Rolls</h3>
                <div class="history" id="history"></div>
            </div>
            
            <button onclick="resetStats()" class="btn-reset">Reset Statistics</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
