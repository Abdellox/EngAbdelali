<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎨 Drawing App</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="drawing-container">
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" onclick="setTool('brush')">🖌️ Brush</button>
                <button class="tool-btn" onclick="setTool('eraser')">🧹 Eraser</button>
            </div>
            <div class="tool-group">
                <label>Color</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>
            <div class="tool-group">
                <label>Size: <span id="sizeValue">5</span></label>
                <input type="range" id="brushSize" min="1" max="50" value="5">
            </div>
            <div class="tool-group">
                <button class="btn-clear" onclick="clearCanvas()">Clear</button>
                <button class="btn-save" onclick="saveDrawing()">Save</button>
            </div>
        </div>
        <canvas id="canvas"></canvas>
    </div>
    <script src="app.js"></script>
</body>
</html>
