<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎯 Hangman</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="game-box">
            <div class="hangman-display" id="hangmanDisplay">
                Click "New Game" to start!
            </div>
            
            <div class="word-display" id="wordDisplay">_ _ _ _ _</div>
            
            <div class="info">
                <div class="wrong-letters">Wrong letters: <span id="wrongLetters"></span></div>
                <div class="attempts">Attempts: <span id="wrongCount">0 / 6</span></div>
            </div>
            
            <div class="keyboard" id="keyboard"></div>
            
            <div class="message" id="message"></div>
            <button onclick="newGame()" class="new-game-btn">New Game</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
