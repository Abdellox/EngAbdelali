<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📋 JSON Formatter</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="formatter-box">
            <h2>JSON Formatter & Validator</h2>
            
            <textarea id="input" placeholder='{"name": "John", "age": 30, "city": "New York"}'></textarea>
            
            <div class="controls">
                <button onclick="formatJSON()" class="btn btn-format">Format</button>
                <button onclick="minifyJSON()" class="btn btn-minify">Minify</button>
                <button onclick="validateJSON()" class="btn btn-validate">Validate</button>
                <button onclick="clearAll()" class="btn btn-clear">Clear</button>
            </div>
            
            <div class="output" id="output"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
