<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎮 Memory Game</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="game-container">
            <div class="game-stats">
                <div class="stat">Moves: <span id="moves">0</span></div>
                <div class="stat">Time: <span id="time">0:00</span></div>
                <div class="stat">Matches: <span id="matches">0/8</span></div>
            </div>
            
            <div class="game-board" id="gameBoard"></div>
            
            <button class="btn-restart" onclick="restartGame()">New Game</button>
            
            <div class="win-modal" id="winModal" style="display: none;">
                <div class="modal-content">
                    <h2>🎉 You Won!</h2>
                    <p>Moves: <span id="finalMoves">0</span></p>
                    <p>Time: <span id="finalTime">0:00</span></p>
                    <button onclick="restartGame()">Play Again</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
