<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎲 Number Guessing</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="app-box">
            <h2>Guess the Number!</h2>
            <p>I'm thinking of a number between 1 and 100</p>
            
            <div class="difficulty-buttons">
                <button class="difficulty-btn" onclick="setDifficulty('easy')">Easy (1-50)</button>
                <button class="difficulty-btn active" onclick="setDifficulty('medium')">Medium (1-100)</button>
                <button class="difficulty-btn" onclick="setDifficulty('hard')">Hard (1-200)</button>
            </div>
            
            <div class="input-section">
                <input type="number" id="guessInput" placeholder="Enter your guess" min="1" max="100">
                <button onclick="checkGuess()" class="btn-guess">Guess</button>
            </div>
            
            <div id="feedback" class="feedback">Guess a number between 1 and 100!</div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="attempts">0</div>
                    <div class="stat-label">Attempts</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="maxAttempts">8</div>
                    <div class="stat-label">Max Attempts</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="difficultyDisplay">Medium (1-100)</div>
                    <div class="stat-label">Difficulty</div>
                </div>
            </div>
            
            <div class="history" id="history"></div>
            
            <button onclick="newGame()" class="btn-guess">New Game</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
