<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">✂️ Rock Paper Scissors</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="game-box">
            <div class="header">
                <h1>Rock Paper Scissors</h1>
                <p class="subtitle">Choose your weapon!</p>
            </div>
            
            <div class="score-board">
                <div class="score-item">
                    <div class="score-label">You</div>
                    <div class="score-value" id="playerScore">0</div>
                </div>
                <div class="vs">VS</div>
                <div class="score-item">
                    <div class="score-label">Computer</div>
                    <div class="score-value" id="computerScore">0</div>
                </div>
            </div>
            
            <div class="battle-area">
                <div class="choice-display">
                    <div class="player-side">
                        <div class="choice-label">You</div>
                        <div class="choice-emoji" id="playerChoice">❓</div>
                    </div>
                    <div class="vs-small">VS</div>
                    <div class="computer-side">
                        <div class="choice-label">Computer</div>
                        <div class="choice-emoji" id="computerChoice">❓</div>
                    </div>
                </div>
            </div>
            
            <div class="result" id="result">Choose your move!</div>
            
            <div class="choices">
                <button onclick="play('rock')" class="choice-btn">
                    <span class="choice-emoji">🪨</span>
                    <span class="choice-name">Rock</span>
                </button>
                <button onclick="play('paper')" class="choice-btn">
                    <span class="choice-emoji">📄</span>
                    <span class="choice-name">Paper</span>
                </button>
                <button onclick="play('scissors')" class="choice-btn">
                    <span class="choice-emoji">✂️</span>
                    <span class="choice-name">Scissors</span>
                </button>
            </div>
            
            <div class="controls">
                <button onclick="resetGame()" class="btn-reset">New Game</button>
            </div>
            
            <div class="instructions">
                <h3>How to Play</h3>
                <p>🪨 Rock beats ✂️ Scissors</p>
                <p>📄 Paper beats 🪨 Rock</p>
                <p>✂️ Scissors beats 📄 Paper</p>
                <p class="keyboard-hint">Keyboard: R (Rock), P (Paper), S (Scissors)</p>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
