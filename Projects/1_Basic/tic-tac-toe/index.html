<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">⭕ Tic Tac Toe</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="game-container">
            <div class="game-info">
                <div class="player-turn" id="playerTurn">Player X's Turn</div>
                <div class="score">
                    <div>X: <span id="scoreX">0</span></div>
                    <div>Draws: <span id="scoreDraw">0</span></div>
                    <div>O: <span id="scoreO">0</span></div>
                </div>
            </div>
            
            <div class="game-board" id="gameBoard">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="game-controls">
                <button id="resetBtn" class="btn">Reset Game</button>
                <button id="newGameBtn" class="btn">New Game</button>
            </div>
            
            <div class="winner-message" id="winnerMessage">
                <div class="winner-text" id="winnerText"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
