<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - FreelanceHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h2>💼 FreelanceHub</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="jobs.html">Browse Jobs</a></li>
                <li><a href="post.html">Post Job</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">☰</button>
        </div>
    </nav>

    <!-- Job Details -->
    <section class="job-details-section">
        <div class="container">
            <a href="jobs.html" class="back-link">← Back to Jobs</a>
            
            <div class="job-details-container" id="jobDetailsContainer">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Apply Modal -->
    <div id="applyModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Apply for Job</h2>
            <form id="applyForm">
                <input type="hidden" id="applyJobId">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="applicantName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="applicantEmail" required>
                </div>
                <div class="form-group">
                    <label>Cover Letter</label>
                    <textarea id="coverLetter" rows="5" required></textarea>
                </div>
                <div class="form-group">
                    <label>Proposed Rate ($)</label>
                    <input type="number" id="proposedRate" required>
                </div>
                <button type="submit" class="btn btn-primary">Submit Application</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 FreelanceHub. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
