<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - خدماتي</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }
        .auth-box {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .auth-tab {
            flex: 1;
            padding: 1rem;
            border: none;
            background: var(--bg-light);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
        }
        .auth-tab.active {
            background: var(--primary-color);
            color: white;
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .user-type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .user-type-card {
            padding: 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .user-type-card:hover {
            border-color: var(--primary-color);
        }
        .user-type-card.selected {
            border-color: var(--primary-color);
            background: rgba(37, 99, 235, 0.1);
        }
        .user-type-card input[type="radio"] {
            display: none;
        }
        .user-type-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        .success-message {
            background: #efe;
            color: #3c3;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        .back-home {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-home a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 style="text-align: center; margin-bottom: 2rem; color: var(--primary-color);">خدماتي</h1>
            
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">تسجيل الدخول</button>
                <button class="auth-tab" data-tab="register">إنشاء حساب</button>
            </div>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">تسجيل الدخول</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <div class="user-type-selector">
                    <label class="user-type-card selected">
                        <input type="radio" name="userType" value="client" checked>
                        <div class="user-type-icon">👤</div>
                        <div>عميل</div>
                    </label>
                    <label class="user-type-card">
                        <input type="radio" name="userType" value="professional">
                        <div class="user-type-icon">👨‍🔧</div>
                        <div>محترف</div>
                    </label>
                </div>

                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="register-name" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="register-phone" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="register-password" required>
                </div>
                <div class="form-group" id="profession-group" style="display: none;">
                    <label>المهنة</label>
                    <select id="register-profession">
                        <option value="">اختر المهنة</option>
                        <option value="babysitter">مربية أطفال</option>
                        <option value="plumber">سباك</option>
                        <option value="electrician">كهربائي</option>
                        <option value="gardener">بستاني</option>
                        <option value="painter">دهان</option>
                        <option value="cleaner">تنظيف</option>
                        <option value="carpenter">نجار</option>
                        <option value="mechanic">ميكانيكي</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">إنشاء حساب</button>
            </form>

            <div class="back-home">
                <a href="index.html">← العودة للصفحة الرئيسية</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
