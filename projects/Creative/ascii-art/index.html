<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎨 ASCII Art</h1>
            <a href="../../../index.html" class="back-link">← Back to Portfolio</a>
        </div>
    </nav>

    <div class="container">
        <div class="art-box">
            <div class="header">
                <h2>ASCII Art Generator</h2>
                <p>Convert images to ASCII art</p>
            </div>

            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <p>Click to upload or drag & drop an image</p>
                    <input type="file" id="imageInput" accept="image/*" hidden>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>Width (characters)</label>
                    <input type="range" id="widthSlider" min="50" max="200" value="100">
                    <span id="widthValue">100</span>
                </div>
                <div class="control-group">
                    <label>Density</label>
                    <select id="densitySelect">
                        <option value="simple">Simple (10 chars)</option>
                        <option value="standard" selected>Standard (70 chars)</option>
                        <option value="complex">Complex (all chars)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Invert Colors</label>
                    <input type="checkbox" id="invertCheck">
                </div>
            </div>

            <div class="button-group">
                <button onclick="generateArt()" class="btn-generate">Generate ASCII Art</button>
                <button onclick="copyToClipboard()" class="btn-copy">Copy to Clipboard</button>
                <button onclick="downloadArt()" class="btn-download">Download as Text</button>
            </div>

            <div class="preview-section">
                <h3>Preview</h3>
                <canvas id="canvas" style="display: none;"></canvas>
                <pre id="asciiOutput" class="ascii-output">Upload an image to get started!</pre>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
