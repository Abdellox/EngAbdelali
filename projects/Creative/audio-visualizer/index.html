<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎵 Audio Visualizer</h1>
            <a href="../../../index.html" class="back-link">← Back to Portfolio</a>
        </div>
    </nav>

    <div class="container">
        <div class="visualizer-box">
            <canvas id="canvas"></canvas>
            
            <div class="controls-overlay">
                <div class="file-input-wrapper">
                    <button class="btn-upload" onclick="document.getElementById('audioInput').click()">
                        📁 Choose Audio File
                    </button>
                    <input type="file" id="audioInput" accept="audio/*" hidden>
                </div>

                <div class="playback-controls">
                    <button id="playBtn" class="control-btn" onclick="togglePlay()">▶️</button>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span id="timeDisplay">0:00 / 0:00</span>
                </div>

                <div class="visualization-controls">
                    <select id="visualizationType" onchange="changeVisualization()">
                        <option value="bars">Bars</option>
                        <option value="wave">Wave</option>
                        <option value="circle">Circle</option>
                        <option value="particles">Particles</option>
                    </select>
                    
                    <label class="color-picker-label">
                        Color: <input type="color" id="colorPicker" value="#667eea">
                    </label>
                </div>

                <div class="info-display" id="infoDisplay">
                    <p>Upload an audio file to start visualizing!</p>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio" style="display: none;"></audio>
    <script src="app.js"></script>
</body>
</html>
