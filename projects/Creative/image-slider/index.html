<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">🖼️ Image Slider</h1>
      <a href="../../../index.html" class="back-link">← Back</a>
    </div>
  </nav>
  <div class="container">
    <h2>Image Slider</h2>
    <div class="slider">
      <button class="slider-btn prev" id="prevBtn">‹</button>
      <div class="slider-container">
        <div class="slide active" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
          <h2>Slide 1</h2>
          <p>Beautiful gradient design</p>
        </div>
        <div class="slide" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
          <h2>Slide 2</h2>
          <p>Stunning pink gradient</p>
        </div>
        <div class="slide" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
          <h2>Slide 3</h2>
          <p>Cool blue gradient</p>
        </div>
        <div class="slide" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
          <h2>Slide 4</h2>
          <p>Fresh green gradient</p>
        </div>
      </div>
      <button class="slider-btn next" id="nextBtn">›</button>
    </div>
    <div class="slider-indicators" id="indicators"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
