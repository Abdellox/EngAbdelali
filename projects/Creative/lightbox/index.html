<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightbox Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">💡 Lightbox</h1>
      <a href="../../../index.html" class="back-link">← Back</a>
    </div>
  </nav>
  <div class="container">
    <h2>Lightbox Gallery</h2>
    <p class="subtitle">Click on any image to view in lightbox</p>
    <div class="gallery">
      <div class="gallery-item" data-index="0">
        <div class="image-placeholder" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
          <span>Image 1</span>
        </div>
      </div>
      <div class="gallery-item" data-index="1">
        <div class="image-placeholder" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
          <span>Image 2</span>
        </div>
      </div>
      <div class="gallery-item" data-index="2">
        <div class="image-placeholder" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
          <span>Image 3</span>
        </div>
      </div>
      <div class="gallery-item" data-index="3">
        <div class="image-placeholder" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
          <span>Image 4</span>
        </div>
      </div>
      <div class="gallery-item" data-index="4">
        <div class="image-placeholder" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
          <span>Image 5</span>
        </div>
      </div>
      <div class="gallery-item" data-index="5">
        <div class="image-placeholder" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);">
          <span>Image 6</span>
        </div>
      </div>
    </div>
  </div>
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="closeBtn">×</button>
    <button class="lightbox-nav prev" id="prevBtn">‹</button>
    <div class="lightbox-content" id="lightboxContent"></div>
    <button class="lightbox-nav next" id="nextBtn">›</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
