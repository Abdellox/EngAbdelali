<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Beautifier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">✨ Code Beautifier</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="beautifier-box">
            <div class="controls">
                <select id="typeSelect">
                    <option value="json">JSON</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="js">JavaScript</option>
                </select>
                <button onclick="beautify()" class="btn">Beautify</button>
                <button onclick="minify()" class="btn">Minify</button>
                <button onclick="copy()" class="btn">Copy</button>
                <button onclick="clear()" class="btn">Clear</button>
            </div>
            
            <textarea id="input" placeholder="Paste your code here..."></textarea>
            <textarea id="output" readonly placeholder="Beautified code will appear here..."></textarea>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
