<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Diff Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📊 Text Diff Checker</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>

    <div class="container">
        <div class="diff-box">
            <div class="controls">
                <button class="btn-compare" onclick="compareTexts()">Compare</button>
                <button class="btn-swap" onclick="swapTexts()">Swap ⇄</button>
                <button class="btn-clear" onclick="clearAll()">Clear</button>
            </div>

            <div class="text-inputs">
                <div class="input-section">
                    <h3>Original Text</h3>
                    <textarea id="text1" placeholder="Enter original text..."></textarea>
                </div>
                <div class="input-section">
                    <h3>Modified Text</h3>
                    <textarea id="text2" placeholder="Enter modified text..."></textarea>
                </div>
            </div>

            <div class="stats" id="stats"></div>

            <div class="diff-result">
                <h3>Comparison Result</h3>
                <div class="result-panels">
                    <div class="result-panel">
                        <h4>Original</h4>
                        <div id="result1" class="result-content"></div>
                    </div>
                    <div class="result-panel">
                        <h4>Modified</h4>
                        <div id="result2" class="result-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
