<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Formatter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📋 XML Formatter</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <h1>XML Formatter</h1>
        <textarea id="input" placeholder="Paste your XML here..."></textarea>
        <div class="buttons">
            <button onclick="formatXML()">Format</button>
            <button onclick="minifyXML()">Minify</button>
            <button onclick="copyOutput()">Copy</button>
        </div>
        <textarea id="output" placeholder="Formatted XML will appear here..." readonly></textarea>
    </div>
    <script src="app.js"></script>
</body>
</html>
