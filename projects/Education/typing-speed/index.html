<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">⌨️ Typing Speed Test</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    <div class="typing-container">
        <div class="typing-box">
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="timer">60s</span>
                </div>
    <div class="stat">
                    <span class="stat-label">WPM</span>
                    <span class="stat-value" id="wpm">0</span>
                </div>
    <div class="stat">
                    <span class="stat-label">Accuracy</span>
                    <span class="stat-value" id="accuracy">100%</span>
                </div>
    </div>
            <div class="text-display" id="textDisplay"></div>
    <textarea id="inputArea" placeholder="Start typing here..." disabled></textarea>
            <button class="btn-start" id="startBtn" onclick="startTest()">Start Test</button>
            <div class="result" id="result" style="display: none;">
                <h2>Test Complete! 🎉</h2>
                <p>Your Speed: <strong id="finalWpm">0</strong> WPM</p>
                <p>Accuracy: <strong id="finalAccuracy">0</strong>%</p>
                <button class="btn-restart" onclick="resetTest()">Try Again</button>
            </div>
    </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
