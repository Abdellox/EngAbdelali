<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🔊 Text to Speech</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <h1>Text to Speech</h1>
        <textarea id="textInput" placeholder="Enter text to speak..."></textarea>
        <div class="controls">
            <label>Rate: <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"></label>
            <label>Pitch: <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"></label>
            <label>Volume: <input type="range" id="volume" min="0" max="1" step="0.1" value="1"></label>
        </div>
        <div class="buttons">
            <button onclick="speak()">Speak</button>
            <button onclick="stopSpeaking()">Stop</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
