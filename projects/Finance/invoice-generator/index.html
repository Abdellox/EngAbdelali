<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="editor-section">
            <h1>📄 Invoice Generator</h1>
            <a href="../../../index.html" class="back-link">← Back</a>

            <div class="form-section">
                <h2>Your Information</h2>
                <div class="form-group">
                    <label>Your Company Name</label>
                    <input type="text" id="companyName" placeholder="Your Company Inc.">
                </div>
                <div class="form-group">
                    <label>Your Email</label>
                    <input type="email" id="companyEmail" placeholder="contact@company.com">
                </div>
                <div class="form-group">
                    <label>Your Address</label>
                    <textarea id="companyAddress" rows="2" placeholder="123 Business St, City, Country"></textarea>
                </div>
            </div>

            <div class="form-section">
                <h2>Client Information</h2>
                <div class="form-group">
                    <label>Client Name</label>
                    <input type="text" id="clientName" placeholder="Client Name">
                </div>
                <div class="form-group">
                    <label>Client Email</label>
                    <input type="email" id="clientEmail" placeholder="client@email.com">
                </div>
                <div class="form-group">
                    <label>Client Address</label>
                    <textarea id="clientAddress" rows="2" placeholder="456 Client Ave, City, Country"></textarea>
                </div>
            </div>

            <div class="form-section">
                <h2>Invoice Details</h2>
                <div class="form-group">
                    <label>Invoice Number</label>
                    <input type="text" id="invoiceNumber" placeholder="INV-001">
                </div>
                <div class="form-group">
                    <label>Invoice Date</label>
                    <input type="date" id="invoiceDate">
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="dueDate">
                </div>
            </div>

            <div class="form-section">
                <h2>Items</h2>
                <div class="items-section" id="itemsContainer"></div>
                <button class="add-item-btn" id="addItemBtn">+ Add Item</button>
            </div>

            <div class="actions">
                <button class="btn generate-btn" id="generateBtn">Generate Invoice</button>
                <button class="btn download-btn" id="downloadBtn">Download PDF</button>
            </div>
        </div>

        <div class="preview-section">
            <h2>Preview</h2>
            <div id="invoicePreview"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
