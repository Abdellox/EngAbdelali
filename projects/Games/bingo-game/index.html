<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎰 Bingo Game</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="game-box">
            <div class="header">
                <h2>BINGO!</h2>
                <button onclick="newGame()" class="btn-new">New Game</button>
            </div>
            <div class="current-number" id="currentNumber">
                <div class="number-display">-</div>
                <button onclick="drawNumber()" class="btn-draw">Draw Number</button>
            </div>
            <div class="bingo-card" id="bingoCard"></div>
            <div class="called-numbers">
                <h3>Called Numbers</h3>
                <div id="calledList"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
