<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🧩 Puzzle Slider</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="puzzle-box">
            <h2>Sliding Puzzle Game</h2>
            <div class="stats">
                <span>Moves: <strong id="moves">0</strong></span>
                <span>Time: <strong id="time">0:00</strong></span>
            </div>
            <div id="puzzleGrid" class="puzzle-grid"></div>
            <div class="controls">
                <button onclick="shufflePuzzle()" class="btn-shuffle">Shuffle</button>
                <button onclick="resetPuzzle()" class="btn-reset">Reset</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
