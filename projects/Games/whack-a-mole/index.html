<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whack-a-Mole</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><div class="container"><h1 class="logo">🔨 Whack-a-Mole</h1><a href="../../../index.html" class="back-link">← Back</a></div><div class="game-container"><div class="game-box"><div class="game-info"><div>Score: <span id="score">0</span></div><div>Time: <span id="time">30</span>s</div></div><div class="mole-grid"><div class="hole" onclick="whack(0)"><div class="mole"></div></div><div class="hole" onclick="whack(1)"><div class="mole"></div></div><div class="hole" onclick="whack(2)"><div class="mole"></div></div><div class="hole" onclick="whack(3)"><div class="mole"></div></div><div class="hole" onclick="whack(4)"><div class="mole"></div></div><div class="hole" onclick="whack(5)"><div class="mole"></div></div><div class="hole" onclick="whack(6)"><div class="mole"></div></div><div class="hole" onclick="whack(7)"><div class="mole"></div></div><div class="hole" onclick="whack(8)"><div class="mole"></div></div></div><button onclick="startGame()" id="startBtn">Start Game</button></div></div><script src="app.js"></script></body></html>
