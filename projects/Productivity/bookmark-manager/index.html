<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🔖 Bookmarks</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="manager-box">
            <div class="add-section">
                <h3>Add Bookmark</h3>
                <input type="text" id="titleInput" placeholder="Title">
                <input type="url" id="urlInput" placeholder="https://example.com">
                <select id="categoryInput">
                    <option value="work">Work</option>
                    <option value="personal">Personal</option>
                    <option value="learning">Learning</option>
                    <option value="entertainment">Entertainment</option>
                </select>
                <button onclick="addBookmark()" class="btn-add">Add Bookmark</button>
            </div>
            <div class="filter-section">
                <button onclick="filterBookmarks('all')" class="filter-btn active">All</button>
                <button onclick="filterBookmarks('work')" class="filter-btn">Work</button>
                <button onclick="filterBookmarks('personal')" class="filter-btn">Personal</button>
                <button onclick="filterBookmarks('learning')" class="filter-btn">Learning</button>
                <button onclick="filterBookmarks('entertainment')" class="filter-btn">Entertainment</button>
            </div>
            <div class="bookmarks-list" id="bookmarksList"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
