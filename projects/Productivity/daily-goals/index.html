<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Goals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎯 Daily Goals</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="goals-box">
            <div class="progress-section">
                <h3>Today's Progress</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                <div class="progress-text">
                    <span id="completed">0</span> / <span id="total">0</span> completed
                </div>
            </div>
            
            <div class="add-section">
                <input type="text" id="goalInput" placeholder="Add a new goal..." 
                       onkeypress="if(event.key==='Enter')addGoal()">
                <button onclick="addGoal()" class="btn-add">Add Goal</button>
            </div>
            
            <div id="goalsList"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
