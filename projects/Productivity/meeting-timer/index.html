<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">⏲️ Meeting Timer</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <h1>Meeting Cost Calculator</h1>
        <div class="settings">
            <label>
                Participants:
                <input type="number" id="participants" value="5" min="1">
            </label>
            <label>
                Hourly Rate ($):
                <input type="number" id="hourlyRate" value="50" min="1">
            </label>
        </div>
        <div class="display">
            <div class="time" id="time">00:00:00</div>
            <div class="cost" id="cost">$0.00</div>
        </div>
        <div class="buttons">
            <button onclick="startMeeting()" id="startBtn">Start</button>
            <button onclick="stopMeeting()" id="stopBtn" disabled>Stop</button>
            <button onclick="resetMeeting()">Reset</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
