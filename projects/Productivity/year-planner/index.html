<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>year planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📅 Year Planner</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="controls">
            <button onclick="changeYear(-1)">← Previous Year</button>
            <h2 id="currentYear">2025</h2>
            <button onclick="changeYear(1)">Next Year →</button>
        </div>
        <div id="yearGrid" class="year-grid"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
