<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy to Clipboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📋 Copy Tool</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="copy-box">
            <h2>Copy to Clipboard</h2>
            
            <textarea id="textInput" placeholder="Enter text to copy..."></textarea>
            <button onclick="copyText()" class="btn-copy">📋 Copy Text</button>
            
            <div class="examples">
                <h3>Quick Copy Examples</h3>
                <div class="example-item">
                    <code id="ex1">npm install react</code>
                    <button onclick="copyExample('ex1')" class="btn-ex">Copy</button>
                </div>
                <div class="example-item">
                    <code id="ex2">git clone https://github.com/user/repo.git</code>
                    <button onclick="copyExample('ex2')" class="btn-ex">Copy</button>
                </div>
                <div class="example-item">
                    <code id="ex3">const greeting = 'Hello World!';</code>
                    <button onclick="copyExample('ex3')" class="btn-ex">Copy</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
