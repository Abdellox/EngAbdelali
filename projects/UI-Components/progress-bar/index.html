<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📊 Progress Bar</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="progress-box">
            <h2>Progress Bar Demo</h2>
            <div class="progress-item">
                <label>HTML</label>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 90%">90%</div>
                </div>
            </div>
            <div class="progress-item">
                <label>CSS</label>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 85%">85%</div>
                </div>
            </div>
            <div class="progress-item">
                <label>JavaScript</label>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 80%">80%</div>
                </div>
            </div>
            <button onclick="animateProgress()" class="btn-animate">Animate</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
