<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">🎨 Theme Switcher</h1>
      <a href="../../../index.html" class="back-link">← Back</a>
    </div>
  </nav>
  <div class="container">
    <h2>Theme Switcher</h2>
    <p class="subtitle">Switch between light and dark themes</p>
    <div class="theme-toggle">
      <button class="theme-btn" id="themeBtn">
        <span class="icon" id="themeIcon">🌙</span>
        <span class="text" id="themeText">Dark Mode</span>
      </button>
    </div>
    <div class="content-card">
      <h2>Sample Content</h2>
      <p>This is a sample card to demonstrate the theme switching functionality. The colors will change based on the selected theme.</p>
      <button class="btn">Sample Button</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
