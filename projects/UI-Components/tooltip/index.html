<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">💡 Tooltip</h1>
      <a href="../../../index.html" class="back-link">← Back</a>
    </div>
  </nav>
  <div class="container">
    <h2>Tooltip Component</h2>
    <p class="subtitle">Hover over the buttons to see tooltips</p>
    <div class="demo-grid">
      <button class="btn" data-tooltip="This is a top tooltip" data-position="top">Top Tooltip</button>
      <button class="btn" data-tooltip="This is a right tooltip" data-position="right">Right Tooltip</button>
      <button class="btn" data-tooltip="This is a bottom tooltip" data-position="bottom">Bottom Tooltip</button>
      <button class="btn" data-tooltip="This is a left tooltip" data-position="left">Left Tooltip</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
