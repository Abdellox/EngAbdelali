<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📊 Barcode Generator</h1>
            <a href="../../../index.html" class="back-link">← Back to Portfolio</a>
        </div>
    </nav>

    <div class="container">
        <div class="generator-box">
            <div class="header">
                <h2>Barcode Generator</h2>
                <p>Generate barcodes and QR codes instantly</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('barcode')">Barcode</button>
                <button class="tab-btn" onclick="switchTab('qr')">QR Code</button>
            </div>

            <div class="tab-content active" id="barcode-tab">
                <div class="input-section">
                    <div class="input-group">
                        <label for="barcodeText">Enter Text or Number</label>
                        <input type="text" id="barcodeText" placeholder="123456789" maxlength="50">
                    </div>
                    
                    <div class="input-group">
                        <label for="barcodeType">Barcode Type</label>
                        <select id="barcodeType">
                            <option value="code128">Code 128</option>
                            <option value="code39">Code 39</option>
                            <option value="ean13">EAN-13</option>
                            <option value="upc">UPC</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="barcodeHeight">Height (px)</label>
                        <input type="range" id="barcodeHeight" min="50" max="200" value="100">
                        <span id="heightValue">100</span>
                    </div>

                    <button onclick="generateBarcode()" class="btn-generate">Generate Barcode</button>
                </div>

                <div class="output-section">
                    <canvas id="barcodeCanvas"></canvas>
                    <div class="button-group">
                        <button onclick="downloadBarcode()" class="btn-download">Download PNG</button>
                        <button onclick="copyBarcodeImage()" class="btn-copy">Copy Image</button>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="qr-tab">
                <div class="input-section">
                    <div class="input-group">
                        <label for="qrText">Enter Text or URL</label>
                        <textarea id="qrText" placeholder="https://example.com" rows="3"></textarea>
                    </div>

                    <div class="input-group">
                        <label for="qrSize">Size (px)</label>
                        <input type="range" id="qrSize" min="128" max="512" value="256" step="64">
                        <span id="sizeValue">256</span>
                    </div>

                    <div class="input-group">
                        <label for="qrColor">Color</label>
                        <input type="color" id="qrColor" value="#000000">
                    </div>

                    <button onclick="generateQR()" class="btn-generate">Generate QR Code</button>
                </div>

                <div class="output-section">
                    <canvas id="qrCanvas"></canvas>
                    <div class="button-group">
                        <button onclick="downloadQR()" class="btn-download">Download PNG</button>
                        <button onclick="copyQRImage()" class="btn-copy">Copy Image</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
