<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📅 Booking App</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="booking-box">
            <div class="booking-form">
                <h3>Book an Appointment</h3>
                <form id="bookingForm" onsubmit="event.preventDefault();bookAppointment()">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Name *</label>
                            <input type="text" id="nameInput" required>
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="emailInput" required>
                        </div>
                        <div class="form-group">
                            <label>Date *</label>
                            <input type="date" id="dateInput" required>
                        </div>
                        <div class="form-group">
                            <label>Time *</label>
                            <input type="time" id="timeInput" required>
                        </div>
                        <div class="form-group">
                            <label>Service</label>
                            <select id="serviceInput">
                                <option>Consultation</option>
                                <option>Meeting</option>
                                <option>Training</option>
                                <option>Support</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-book">Book Appointment</button>
                </form>
            </div>
            <div class="bookings-list" id="bookingsList"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
