<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📋 Clipboard</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="manager-box">
            <h2>Clipboard Manager</h2>
            
            <div class="input-section">
                <textarea id="textInput" placeholder="Enter text to copy..."></textarea>
                <button onclick="copyText()" class="btn-copy">Copy to Clipboard</button>
            </div>
            
            <div class="history-section">
                <h3>History</h3>
                <div id="historyList"></div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
