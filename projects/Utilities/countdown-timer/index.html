<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">⏱️ Countdown</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="timer-box">
            <div class="display" id="display">00:00:00</div>
            
            <div class="inputs">
                <input type="number" id="hours" placeholder="Hours" min="0" max="23" value="0">
                <input type="number" id="minutes" placeholder="Minutes" min="0" max="59" value="1">
                <input type="number" id="seconds" placeholder="Seconds" min="0" max="59" value="0">
            </div>
            
            <div class="buttons">
                <button onclick="start()" id="startBtn" class="btn btn-start">Start</button>
                <button onclick="pause()" class="btn btn-pause">Pause</button>
                <button onclick="reset()" class="btn btn-reset">Reset</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
