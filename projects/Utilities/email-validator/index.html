<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">✉️ Email Validator</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <h1>Email Validator</h1>
        <div class="validator-box">
            <input type="text" id="emailInput" placeholder="Enter email address..." onkeypress="if(event.key==='Enter') validateEmail()">
            <button onclick="validateEmail()">Validate</button>
        </div>
        <div id="result"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
