<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🏦 Loan Calculator</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    <div class="loan-container">
        <div class="loan-box">
            <h2>Calculate Your Loan</h2>
            <form id="loanForm">
                <div class="input-group">
                    <label>Loan Amount ($)</label>
                    <input type="number" id="amount" value="10000" required>
                </div>
    <div class="input-group">
                    <label>Interest Rate (%)</label>
                    <input type="number" id="interest" value="5" step="0.1" required>
                </div>
    <div class="input-group">
                    <label>Loan Term (Years)</label>
                    <input type="number" id="years" value="5" required>
                </div>
    <button type="submit">Calculate</button>
            </form>
            <div class="result" id="result" style="display: none;">
                <h3>Monthly Payment</h3>
                <div class="payment" id="payment">$0.00</div>
    <div class="details">
                    <p>Total Payment: <strong id="totalPayment">$0.00</strong></p>
                    <p>Total Interest: <strong id="totalInterest">$0.00</strong></p>
                </div>
    </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
