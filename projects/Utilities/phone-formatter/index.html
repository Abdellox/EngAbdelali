<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Formatter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📞 Phone Formatter</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <div class="formatter-box">
            <h2>Phone Number Formatter</h2>
            <p>Format phone numbers to different standards</p>
            
            <div class="input-section">
                <label>Enter Phone Number</label>
                <input type="tel" id="phoneInput" placeholder="1234567890" oninput="formatPhone()">
            </div>
            
            <div class="format-options">
                <label>Format Style</label>
                <select id="formatStyle" onchange="formatPhone()">
                    <option value="us">US: (123) 456-7890</option>
                    <option value="international">International: +1 123 456 7890</option>
                    <option value="dots">Dots: 123.456.7890</option>
                    <option value="dashes">Dashes: 123-456-7890</option>
                </select>
            </div>
            
            <div class="output-section">
                <h3>Formatted Number</h3>
                <div id="output" class="output">Enter a phone number</div>
                <button onclick="copyFormatted()" class="btn-copy">Copy</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
