<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">💵 Tip Calculator</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    <div class="calc-container">
        <div class="calc-box">
            <h2>Calculate Tip</h2>
            <div class="input-group">
                <label>Bill Amount</label>
                <input type="number" id="bill" placeholder="0.00" step="0.01">
            </div>
    <div class="input-group">
                <label>Tip Percentage</label>
                <div class="tip-buttons">
                    <button onclick="setTip(10)">10%</button>
                    <button onclick="setTip(15)" class="active">15%</button>
                    <button onclick="setTip(20)">20%</button>
                    <button onclick="setTip(25)">25%</button>
                </div>
    <input type="number" id="tipPercent" value="15" min="0">
            </div>
    <div class="input-group">
                <label>Number of People</label>
                <input type="number" id="people" value="1" min="1">
            </div>
    <div class="result">
                <div class="result-item">
                    <span>Tip Amount</span>
                    <span class="amount" id="tipAmount">$0.00</span>
                </div>
    <div class="result-item">
                    <span>Total</span>
                    <span class="amount" id="total">$0.00</span>
                </div>
    <div class="result-item">
                    <span>Per Person</span>
                    <span class="amount" id="perPerson">$0.00</span>
                </div>
    </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
