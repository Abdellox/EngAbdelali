<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🌤️ Weather App</h1>
            <a href="../../../index.html" class="back-link">← Back to Portfolio</a>
        </div>

    <div class="container">
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name..." class="search-input">
            <button id="searchBtn" class="search-btn">Search</button>
        </div>

    <div class="weather-card" id="weatherCard">
            <div class="city-name">Casablanca</div>
    <div class="weather-icon">☀️</div>
    <div class="temperature">24°C</div>
    <div class="description">Sunny</div>
            
    <div class="details">
                <div class="detail-item">
                    <span class="detail-icon">💧</span>
                    <div>
                        <div class="detail-label">Humidity</div>
    <div class="detail-value">65%</div>
    </div>
                </div>
    <div class="detail-item">
                    <span class="detail-icon">💨</span>
                    <div>
                        <div class="detail-label">Wind Speed</div>
    <div class="detail-value">12 km/h</div>
    </div>
                </div>
    <div class="detail-item">
                    <span class="detail-icon">🌡️</span>
                    <div>
                        <div class="detail-label">Feels Like</div>
    <div class="detail-value">22°C</div>
    </div>
                </div>
    </div>
        </div>

    <div class="forecast">
            <h3>5-Day Forecast</h3>
            <div class="forecast-grid">
                <div class="forecast-item">
                    <div class="forecast-day">Mon</div>
    <div class="forecast-icon">⛅</div>
    <div class="forecast-temp">23°C</div>
    </div>
                <div class="forecast-item">
                    <div class="forecast-day">Tue</div>
    <div class="forecast-icon">🌧️</div>
    <div class="forecast-temp">19°C</div>
    </div>
                <div class="forecast-item">
                    <div class="forecast-day">Wed</div>
    <div class="forecast-icon">☀️</div>
    <div class="forecast-temp">25°C</div>
    </div>
                <div class="forecast-item">
                    <div class="forecast-day">Thu</div>
    <div class="forecast-icon">⛈️</div>
    <div class="forecast-temp">18°C</div>
    </div>
                <div class="forecast-item">
                    <div class="forecast-day">Fri</div>
    <div class="forecast-icon">☀️</div>
    <div class="forecast-temp">26°C</div>
    </div>
            </div>
    </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
