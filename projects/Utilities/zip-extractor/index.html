<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zip extractor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📦 ZIP Extractor</h1>
            <a href="../../../index.html" class="back-link">← Back</a>
        </div>
    </nav>
    <div class="container">
        <h1>ZIP File Extractor</h1>
        <input type="file" id="fileInput" accept=".zip">
        <div class="file-info">
            <p>File: <span id="fileName">No file selected</span></p>
            <p>Size: <span id="fileSize">0 KB</span></p>
        </div>
        <button onclick="extractZip()">Extract ZIP</button>
        <div id="result" class="result"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
